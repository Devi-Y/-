<body>
<div class="glass-card">

<script>
    (function() {
        // ========== 核心参数 ==========
        const BASE_MODEL = 4860;           // 基础拟合值 (美元/盎司)
        const RATE_BASE = 4.30;             // 基准美债利率
        const DOLLAR_BASE = 103.5;           // 基准美元指数
        const INFLATION_BASE = 2.30;         // 基准通胀预期
        
        // 因子敏感系数
        const RATE_SENSITIVITY = -150;
        const DOLLAR_SENSITIVITY = -12;
        const INFLATION_SENSITIVITY = 200;

        // 盎司 → 克 转换
        const OZ_TO_GRAM = 31.1035;

        // 阈值
        const SELL_TH = 9.0;
        const STRONG_BUY_TH = -3.0;

        // 当前宏观因子值
        let currentRate = 4.28;
        let currentDollar = 103.6;
        let currentInflation = 2.35;

        // ========== 近3年历史数据 (基于真实市场数据) ==========
        // 美元历史数据 (月度收盘价) 2023年3月 - 2026年2月 [citation:4][citation:9]
        const usdHistoryData = [
            { date: '2023-03', price: 1969.55 },
            { date: '2023-04', price: 1990.60 },
            { date: '2023-05', price: 1965.20 },
            { date: '2023-06', price: 1919.57 },
            { date: '2023-07', price: 1964.34 },
            { date: '2023-08', price: 1939.83 },
            { date: '2023-09', price: 1848.49 },
            { date: '2023-10', price: 1984.01 },
            { date: '2023-11', price: 2044.90 },
            { date: '2023-12', price: 2062.92 },
            { date: '2024-01', price: 2039.15 },
            { date: '2024-02', price: 2044.20 },
            { date: '2024-03', price: 2231.56 },
            { date: '2024-04', price: 2285.99 },
            { date: '2024-05', price: 2327.28 },
            { date: '2024-06', price: 2326.72 },
            { date: '2024-07', price: 2409.69 },
            { date: '2024-08', price: 2503.38 },
            { date: '2024-09', price: 2664.41 },
            { date: '2024-10', price: 2746.70 },
            { date: '2024-11', price: 2651.25 },
            { date: '2024-12', price: 2624.60 },
            { date: '2025-01', price: 2798.20 },
            { date: '2025-02', price: 2876.21 },
            { date: '2025-03', price: 3086.34 },
            { date: '2025-04', price: 3273.50 },
            { date: '2025-05', price: 3289.55 },
            { date: '2025-06', price: 3266.41 },
            { date: '2025-07', price: 3285.78 },
            { date: '2025-08', price: 3415.77 },
            { date: '2025-09', price: 3836.23 },
            { date: '2025-10', price: 4002.77 },
            { date: '2025-11', price: 4217.36 },
            { date: '2025-12', price: 4322.36 },
            { date: '2026-01', price: 4865.35 },
            { date: '2026-02', price: 5277.89 }
        ];

        // 人民币历史数据 (元/克) 基于美元数据 × 汇率 ÷ 31.1035 计算，并用实际人民币数据校准 [citation:5]
        // YCharts数据显示2026年1月人民币金价为33063.40 CNY/盎司 → 33063.40/31.1035 ≈ 1063 CNY/克
        const cnyHistoryData = usdHistoryData.map(item => {
            // 使用实际汇率7.20计算，并参考YCharts数据校准 [citation:5]
            let cnyPrice;
            if (item.date === '2026-01') {
                cnyPrice = 1063; // 基于实际数据
            } else if (item.date === '2026-02') {
                cnyPrice = 1156; // 估算
            } else if (item.date === '2025-12') {
                cnyPrice = 973; // 30239.40/31.1035 ≈ 972
            } else {
                // 其他月份用美元价 × 7.20 / 31.1035 估算
                cnyPrice = Math.round(item.price * 7.20 / OZ_TO_GRAM);
            }
            return {
                date: item.date,
                price: cnyPrice
            };
        });

        // DOM 元素
        const usdInput = document.getElementById('usdInput');
        const cnyInput = document.getElementById('cnyInput');
        const exchangeRateInput = document.getElementById('exchangeRate');
        const applyRateBtn = document.getElementById('applyRateBtn');
        const calcBtn = document.getElementById('calcBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const rateSpan = document.getElementById('rateValue');
        const dollarSpan = document.getElementById('dollarValue');
        const inflationSpan = document.getElementById('inflationValue');
        const usdDevBadge = document.getElementById('usdDeviationBadge');
        const cnyDevBadge = document.getElementById('cnyDeviationBadge');

        // 图表相关
        const usdCtx = document.getElementById('usdChart').getContext('2d');
        const cnyCtx = document.getElementById('cnyChart').getContext('2d');
        let usdChart, cnyChart;

        // 更新宏观显示
        function updateMacroDisplay() {
            rateSpan.textContent = currentRate.toFixed(2);
            dollarSpan.textContent = currentDollar.toFixed(1);
            inflationSpan.textContent = currentInflation.toFixed(2);
        }

        // 计算美元拟合值
        function calculateUsdModelPrice() {
            const rateDiff = currentRate - RATE_BASE;
            const dollarDiff = currentDollar - DOLLAR_BASE;
            const inflationDiff = currentInflation - INFLATION_BASE;
            
            const rateContribution = rateDiff * RATE_SENSITIVITY;
            const dollarContribution = dollarDiff * DOLLAR_SENSITIVITY;
            const inflationContribution = inflationDiff * INFLATION_SENSITIVITY;
            
            let modelPrice = BASE_MODEL + rateContribution + dollarContribution + inflationContribution;
            return Math.round(modelPrice);
        }

        // 获取人民币拟合值 (元/克)
        function getCnyModelPrice(usdModel, rate) {
            return Math.round(usdModel * rate / OZ_TO_GRAM);
        }

        // 获取信号信息
        function getSignalInfo(deviation) {
            if (deviation > SELL_TH) {
                return {
                    color: '#b91c1c',
                    bg: 'rgba(185, 28, 28, 0.15)',
                    emoji: '🔴',
                    text: '卖出信号 · 短期超涨',
                    advice: '偏离度超过9%，市场过度定价“秩序重构”预期，短期溢价极端化，建议减持锁定利润。'
                };
            } else if (deviation > 5.0) {
                return {
                    color: '#b45309',
                    bg: 'rgba(180, 83, 9, 0.15)',
                    emoji: '🟡',
                    text: '观望信号 · 偏高区域',
                    advice: '偏离度在5%~9%之间，包含较高秩序溢价但未到极端，多空博弈激烈，建议等待明确方向。'
                };
            } else if (deviation >= STRONG_BUY_TH) {
                return {
                    color: '#065f46',
                    bg: 'rgba(6, 95, 70, 0.15)',
                    emoji: '🟢',
                    text: '持有/买入区域 · 估值合理',
                    advice: '偏离度在合理区间(-3%~5%)，金价靠近传统模型定价，秩序溢价有限。可持有或分批布局。'
                };
            } else {
                return {
                    color: '#0057b3',
                    bg: 'rgba(0, 87, 179, 0.15)',
                    emoji: '⚡',
                    text: '强烈买入信号 · 传统估值回归',
                    advice: '偏离度为负，金价低于传统模型拟合值，安全边际较高，是中长期布局的较好时机。'
                };
            }
        }

        // 渲染结果卡片
        function renderResultCard(currency, price, modelPrice, deviation, unit) {
            const info = getSignalInfo(deviation);
            const devFixed = deviation.toFixed(2);
            const currencySymbol = currency === 'USD' ? '$' : '¥';
            
            return `
                <div class="result-card" style="background: ${info.bg}; border-left-color: ${info.color};">
                    <div class="result-currency">${currency === 'USD' ? '💵 美元' : '🇨🇳 人民币'}</div>
                    <div class="deviation-large">
                        ${devFixed}% <small>偏离度</small>
                    </div>
                    <div class="signal-text" style="color: ${info.color};">${info.emoji} ${info.text}</div>
                    <div class="advice">${info.advice}</div>
                    <div class="price-detail">
                        <span>💰 当前: ${currencySymbol}${Math.round(price)}</span>
                        <span>📐 拟合: ${currencySymbol}${Math.round(modelPrice)}</span>
                        <span>${unit}</span>
                    </div>
                </div>
            `;
        }

        // 初始化图表
        function initCharts() {
            // 美元图表
            usdChart = new Chart(usdCtx, {
                type: 'line',
                data: {
                    labels: usdHistoryData.map(d => d.date),
                    datasets: [
                        {
                            label: '历史价格',
                            data: usdHistoryData.map(d => d.price),
                            borderColor: '#f5c542',
                            backgroundColor: 'rgba(245, 197, 66, 0.1)',
                            borderWidth: 2,
                            pointRadius: 2,
                            pointHoverRadius: 5,
                            tension: 0.1,
                            fill: false
                        },
                        {
                            label: '当前价',
                            data: new Array(usdHistoryData.length).fill(null),
                            borderColor: 'transparent',
                            backgroundColor: '#ffd966',
                            pointRadius: 8,
                            pointHoverRadius: 12,
                            pointStyle: 'circle',
                            showLine: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            ticks: { color: 'rgba(255,255,255,0.7)' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: 'rgba(255,255,255,0.5)', maxRotation: 45, maxTicksLimit: 8 }
                        }
                    }
                }
            });

            // 人民币图表
            cnyChart = new Chart(cnyCtx, {
                type: 'line',
                data: {
                    labels: cnyHistoryData.map(d => d.date),
                    datasets: [
                        {
                            label: '历史价格',
                            data: cnyHistoryData.map(d => d.price),
                            borderColor: '#f5c542',
                            backgroundColor: 'rgba(245, 197, 66, 0.1)',
                            borderWidth: 2,
                            pointRadius: 2,
                            pointHoverRadius: 5,
                            tension: 0.1,
                            fill: false
                        },
                        {
                            label: '当前价',
                            data: new Array(cnyHistoryData.length).fill(null),
                            borderColor: 'transparent',
                            backgroundColor: '#ffd966',
                            pointRadius: 8,
                            pointHoverRadius: 12,
                            pointStyle: 'circle',
                            showLine: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            ticks: { color: 'rgba(255,255,255,0.7)' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: 'rgba(255,255,255,0.5)', maxRotation: 45, maxTicksLimit: 8 }
                        }
                    }
                }
            });
        }

        // 更新图表数据
        function updateCharts(usdModel, cnyModel, usdPrice, cnyPrice, usdDev, cnyDev) {
            // 更新偏离度标签
            usdDevBadge.textContent = `偏离度: ${usdDev.toFixed(2)}%`;
            cnyDevBadge.textContent = `偏离度: ${cnyDev.toFixed(2)}%`;
            
            // 设置偏离度颜色
            usdDevBadge.style.background = usdDev > SELL_TH ? 'rgba(185,28,28,0.3)' : 
                                          (usdDev < STRONG_BUY_TH ? 'rgba(0,87,179,0.3)' : 'rgba(0,0,0,0.3)');
            cnyDevBadge.style.background = cnyDev > SELL_TH ? 'rgba(185,28,28,0.3)' : 
                                          (cnyDev < STRONG_BUY_TH ? 'rgba(0,87,179,0.3)' : 'rgba(0,0,0,0.3)');

            // 更新美元图表 - 在最后一个点显示当前价
            const usdPointData = new Array(usdHistoryData.length).fill(null);
            usdPointData[usdHistoryData.length - 1] = usdPrice;
            usdChart.data.datasets[1].data = usdPointData;
            usdChart.update();

            // 更新人民币图表
            const cnyPointData = new Array(cnyHistoryData.length).fill(null);
            cnyPointData[cnyHistoryData.length - 1] = cnyPrice;
            cnyChart.data.datasets[1].data = cnyPointData;
            cnyChart.update();
        }

        // 计算并更新所有
        function calculate() {
            const usdModel = calculateUsdModelPrice();
            const rate = parseFloat(exchangeRateInput.value) || 7.20;
            const cnyModel = getCnyModelPrice(usdModel, rate);

            const usdPrice = parseFloat(usdInput.value);
            const cnyPrice = parseFloat(cnyInput.value);

            let resultsHtml = '';
            let usdDev = 0, cnyDev = 0;

            // 处理美元
            if (!isNaN(usdPrice) && usdPrice > 0) {
                usdDev = (usdPrice - usdModel) / usdModel * 100;
                resultsHtml += renderResultCard('USD', usdPrice, usdModel, usdDev, '美元/盎司');
            }

            // 处理人民币
            if (!isNaN(cnyPrice) && cnyPrice > 0) {
                cnyDev = (cnyPrice - cnyModel) / cnyModel * 100;
                resultsHtml += renderResultCard('CNY', cnyPrice, cnyModel, cnyDev, '元/克');
            }

            if (resultsHtml === '') {
                resultsHtml = '<div class="no-data">请输入至少一个有效价格</div>';
            }
            resultsContainer.innerHTML = resultsHtml;

            // 更新图表
            updateCharts(usdModel, cnyModel, 
                !isNaN(usdPrice) && usdPrice > 0 ? usdPrice : usdModel, 
                !isNaN(cnyPrice) && cnyPrice > 0 ? cnyPrice : cnyModel,
                usdDev, cnyDev);
        }

        // 调整宏观因子
        window.adjustMacro = function(type, delta) {
            if (type === 'rate') {
                currentRate = Math.max(2.0, Math.min(6.0, currentRate + delta));
            } else if (type === 'dollar') {
                currentDollar = Math.max(90, Math.min(120, currentDollar + delta));
            } else if (type === 'inflation') {
                currentInflation = Math.max(1.0, Math.min(4.0, currentInflation + delta));
            }
            updateMacroDisplay();
            calculate();
        };

        window.resetMacro = function() {
            currentRate = 4.28;
            currentDollar = 103.6;
            currentInflation = 2.35;
            updateMacroDisplay();
            calculate();
        };

        // 应用汇率
        applyRateBtn.addEventListener('click', function() {
            calculate();
        });

        // 绑定计算按钮
        calcBtn.addEventListener('click', calculate);

        // 回车触发
        usdInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') calculate(); });
        cnyInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') calculate(); });
        exchangeRateInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') calculate(); });

        // 初始化
        updateMacroDisplay();
        // 设置默认人民币 (5300*7.20/31.1035 ≈ 1227)
        cnyInput.value = Math.round(5300 * 7.20 / OZ_TO_GRAM);
        initCharts();
        calculate();
    })();
</script>
</body>
</html>
